name: Scrape and test proxies

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scrape.js
      - name: Commit
        run: |
          git config user.name "proxy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add proxies
          git diff --cached --quiet || (git commit -m "update proxies $(date -u '+%F %H:%M')" && git push)
